site_name: Daniel's Book
site_description: AI / LLM / RL / PyTorch Notes
site_url: https://zhangdaniel942.github.io/daniel_learnings/

docs_dir: docs

repo_name: Daniel学习笔记
repo_url: https://github.com/ZhangDaniel942/daniel_learnings
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: a00_aresource/logo.svg
  favicon: a00_aresource/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.prune
    - navigation.index
    - toc.follow
    - header.autohide
    - search.highlight
    - search.share
    - content.acode.copy
    - content.acode.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - a00_acode/css/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - a00_acode/js/mathjax.js
  - a00_acode/js/tasks.js
  - a00_acode/js/counts.js
  - https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js

plugins:
  - search
  - tags:
      tags_file: tags.md
  - blog:
      blog_dir: blog
      post_dir: blog/posts
      post_date_format: yyyy-MM-dd
      archive: true
      archive_date_format: yyyy-MM
      archive_url_date_format: yyyy-MM

nav:
  - 作者: index.md

  - todo :
      - todo/index.md

  - 学习 :
    - ML笔记:
      - ai_learning_log/reinforce_learning/day01_MDP及策略梯度.md
    - LLM笔记:
      - ai_learning_log/reinforce_learning/day01_MDP及策略梯度.md
    - RL笔记:
      - ai_learning_log/reinforce_learning/day01_MDP及策略梯度.md



  - Blog:
      - 全部: blog/index.md

  - Tags: tags.md
